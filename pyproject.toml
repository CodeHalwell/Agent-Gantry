[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-gantry"
version = "0.1.4"
description = "Universal Tool Orchestration Platform - Intelligent, secure tool orchestration for LLM-based agent systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Agent-Gantry Contributors" }
]
keywords = [
    "llm",
    "agents",
    "tools",
    "mcp",
    "orchestration",
    "semantic-routing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema>=4.18.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "python-dotenv>=1.0.0",
]
agent-frameworks = [
    "agent-framework>=1.0.0,<2.0.0",
    "autogen-agentchat>=0.7.5",
    "autogen-ext[openai]>=0.7.5",
    "crewai>=1.6.1",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.14",
    "langgraph>=1.1.9",
    "llama-index-core>=0.14.10",
    "llama-index-llms-openai>=0.6.12",
    "semantic-kernel>=1.30.0",
    "google-adk>=1.14.1",
]
example-tools = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "einops>=0.8.1",
    "huggingface-hub[hf-xet]>=0.36.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pint>=0.24.4",
    "psutil>=5.9.0",
    "pubchempy>=1.0.5",
    "pypdf>=3.0.0",
    "python-barcode>=0.15.0",
    "python-docx>=1.0.0",
    "python-dotenv>=1.1.1",
    "pytz>=2023.3",
    "qrcode>=7.4.0",
    "rdkit>=2025.9.3",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "sympy>=1.14.0",
    "textblob>=0.18.0",
]
# Individual embedding providers
embeddings = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
]
openai = [
    "openai>=2.0.0",
]
cohere = [
    "cohere>=5.0.0",
]
# Individual vector store providers
qdrant = [
    "qdrant-client>=1.7.0",
]
chroma = [
    "chromadb>=0.4.0",
]
pgvector = [
    "asyncpg>=0.29.0",
]
lancedb = [
    "lancedb>=0.4.0",
    "pyarrow>=14.0.1",
]
# Combined vector stores
vector-stores = [
    "qdrant-client>=1.7.0",
    "chromadb>=0.4.0",
    "asyncpg>=0.29.0",
]
nomic = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "einops>=0.8.1",
]
mcp = [
    "mcp>=1.0.0",
]
a2a = [
    "httpx>=0.24.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
# LLM provider SDK dependencies
anthropic = [
    "anthropic>=0.96.0",
]
google-genai = [
    "google-genai>=1.0.0",
]
google-vertexai = [
    "google-cloud-aiplatform>=1.70.0",
]
mistral = [
    "mistralai>=1.0.0,<2.0.0",
]
groq = [
    "groq>=1.0.0",
]
# Combined LLM provider dependencies
llm-providers = [
    "agent-gantry[openai,anthropic,google-genai,google-vertexai,mistral,groq]",
]
all = [
    "agent-gantry[dev,embeddings,openai,cohere,vector-stores,lancedb,nomic,mcp,a2a,llm-providers,agent-frameworks,example-tools]",
]

[project.scripts]
agent-gantry = "agent_gantry.cli:main"

[project.urls]
Homepage = "https://github.com/CodeHalwell/Agent-Gantry"
Repository = "https://github.com/CodeHalwell/Agent-Gantry"

[tool.hatch.build.targets.wheel]
packages = ["agent_gantry"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
prerelease = "if-necessary-or-explicit"
# Force an onnxruntime version that ships cp310 wheels. onnxruntime >=1.24.0
# dropped Python 3.10 support (only cp311/cp312/cp313 wheels are published),
# but the resolver still picks it because the sdist metadata advertises
# Python 3.10 compatibility. Pin to the 1.23.x series for 3.10 so uv sync
# on the CI matrix entry `test (ubuntu-latest, 3.10)` actually has a wheel
# to install.
override-dependencies = [
    "onnxruntime<1.24 ; python_version < '3.11'",
]

