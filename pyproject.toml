[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-gantry"
version = "0.10.0"
description = "Universal Tool Orchestration Platform - Intelligent, secure tool orchestration for LLM-based agent systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Agent-Gantry Contributors" }
]
keywords = [
    "llm",
    "agents",
    "tools",
    "mcp",
    "orchestration",
    "semantic-routing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema>=4.18.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    # pytest-asyncio 1.x changed event-loop lifecycle on macOS (kqueue) + Python
    # 3.10/3.12, causing CI failures. Pin to the stable 0.x series until the
    # upstream compatibility issue is resolved.
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "python-dotenv>=1.0.0",
]
agent-frameworks = [
    # Range: >=1.5.0,<2.0.0.
    # AF 1.13.0 (released 2026-07-30) is the latest within range — the resolver
    # already picks it; no floor change needed. Releases 1.9.0–1.13.0
    # (2026-06-18 → 2026-07-30) verified 2026-08-03: breaking changes are
    # confined to AF's own Skills API (1.11.0 caching restructure — Gantry uses
    # its own SkillRegistry, unaffected), workflow TOOL_CALL event emission and
    # harness-agent graduation (1.12.0), and fully-replayable workflow
    # checkpoints (1.13.0). Nothing removes an API Gantry uses. The 1.6.0
    # concurrent-instrumentation ContextVar bug has NO documented fix through
    # 1.13.0 — keep the disable_af_instrumentation shim (see below).
    # AF 1.8.0 (released 2026-06-04): adds McpSkillsSource for MCP-based
    # skills discovery, progressive tool exposure via FunctionInvocationContext,
    # background-agent harness support, and AgentFileStore / FileAccessProvider
    # for file-access operations.  Bug fixes: resolves message-id collisions in
    # compaction (benefits GantryContextProvider), fixes unsafe serialisation of
    # function arguments in AF's observability layer (benefits GantryToolBridge).
    # Skill API refactored to async resource / script lookup (experimental — not
    # used by Gantry, which uses its own SkillRegistry).  Sync tools now execute
    # off the event loop; Gantry's bridge already wraps all callables as async so
    # no double-wrapping occurs.  Breaking change: github-copilot-sdk upgraded to
    # v1.0.0 stable (not used by Gantry).  No Gantry code changes required.
    # Source: https://pypi.org/pypi/agent-framework/json
    #         https://github.com/microsoft/agent-framework/releases
    #
    # AF 1.7.0 (released 2026-05-28): adds HarnessAgent / background-agents
    # harness provider, A2AAgentSession with referenced task IDs, and fixes a
    # streaming memory-growth regression in DevUI and hosted handoff argument
    # serialisation.  Breaking change: "Remove Python-only declarative actions
    # and rename alias kinds to C# canonical names." Gantry does NOT use
    # declarative actions (@agent_framework.action), so no Gantry code is
    # affected.  Checkpoint restoration for MessageRole values is now fixed,
    # which benefits HandoffBuilder workflows that use serialised checkpoints.
    # Source: https://github.com/microsoft/agent-framework/releases
    #
    # AF 1.6.0 (released 2026-05-22) introduced instrumentation enabled by
    # default.  Its ContextVar tokens cannot be reset across asyncio child
    # contexts, so calling two Agent.run() coroutines concurrently via
    # asyncio.gather() / TaskGroup raises:
    #   ValueError: <Token ...> was created in a different Context
    # in agent_framework/observability.py.  This is an upstream bug in AF 1.6.0;
    # it does NOT affect sequential workflows (WorkflowAgent, SequentialBuilder,
    # HandoffBuilder all dispatch one Agent at a time).
    #
    # Workaround for concurrent workflows on AF >=1.6.0:
    #   from agent_gantry import disable_af_instrumentation
    #   disable_af_instrumentation()   # call once before agent construction
    # This shim calls agent_framework.telemetry.disable_instrumentation() when
    # AF >=1.6.0 is detected.  Use GantryObservabilityMiddleware to retain
    # per-invocation tracing without the ContextVar clash.
    # GantryToolBridge also accepts disable_af_instrumentation=True to apply
    # the shim automatically at bridge construction time.
    #
    # AF 1.5.0 features retained: intermediate output handling,
    # ContextProvider.before_run tools-in-session fix (directly benefits
    # GantryContextProvider), Azure OpenAI recording, YAML block scalar parsing.
    # Prior 1.4.0 breaking changes: (1) SkillFrontmatter extraction
    # (experimental, not used by Gantry); (2) DevUI CORS tightening (not
    # relevant). Prior 1.3.0 breaking changes: (3) skills multi-source
    # restructuring (experimental, not used); (4) bespoke Foundry toolbox
    # helpers removed in favour of MCP (not used). Prior 1.2.2 note retained:
    # sequential-approval and concurrent workflow terminal outputs return as
    # AgentResponse — use str() or .content to extract text.
    # Source: https://pypi.org/pypi/agent-framework/json
    #         https://github.com/microsoft/agent-framework/releases
    "agent-framework>=1.5.0,<2.0.0",
    "autogen-agentchat>=0.7.5",
    "autogen-ext[openai]>=0.7.5",
    # crewai 1.15.10 (latest stable, 2026-07-31). The long-standing
    # opentelemetry conflict with agent-framework is RESOLVED as of crewai
    # 1.15.0 (2026-06-25): the pin moved from opentelemetry-api~=1.34.0 to
    # ~=1.42.0, which overlaps agent-framework-core's >=1.39,<2 — the two now
    # co-resolve on opentelemetry 1.42.x, so the old "crewai==1.6.1 for
    # co-install" workaround is obsolete and the floor is bumped to 1.15.0.
    # Remaining constraints: crewai pins pydantic>=2.11.9,<2.13 (holds the
    # combined extra on pydantic 2.12.x) and depends on chromadb~=1.1.0.
    # Note: google-adk 1.x (<=1.37.0) caps opentelemetry-api<=1.41.1, which
    # conflicts with crewai>=1.15 — the resolver must pick google-adk 2.x
    # (2.6.1 allows opentelemetry <=1.42.1) in the combined extra.
    # Behavior note for adapter tests: 1.15.9 surfaces tool failures instead
    # of reporting them as success.
    # Source: https://pypi.org/pypi/crewai/json (verified 2026-08-03)
    "crewai>=1.15.0",
    # langchain 1.3.14 (released 2026-07-16) — patch releases only since 1.3.4
    # (1.3.5 was yanked); no API changes.
    # Source: https://pypi.org/pypi/langchain/json (verified 2026-08-03)
    "langchain>=1.3.14",
    # langchain-openai 1.4.1 (released 2026-07-23). 1.4.0 adds reasoning_effort
    # as a standard chat-model param; no breaking changes. Requires
    # openai>=2.45.0,<3 — the openai extra floor is bumped in lockstep.
    # Source: https://pypi.org/pypi/langchain-openai/json (verified 2026-08-03)
    "langchain-openai>=1.4.1",
    # langgraph 1.2.10 (released 2026-07-28) — patch releases only; no API changes.
    # Source: https://pypi.org/pypi/langgraph/json (verified 2026-08-03)
    "langgraph>=1.2.10",
    # llama-index-core 0.14.23 (2026-06-24), llama-index-llms-openai 0.7.10
    # (2026-07-21) — patch releases; no API changes.
    "llama-index-core>=0.14.23",
    "llama-index-llms-openai>=0.7.10",
    # semantic-kernel 1.44.0 (latest stable 2026-07-07). Floor MUST stay at
    # 1.36.0 in this combined extra: a floor bump to >=1.43.1 was attempted on
    # 2026-08-03 and `uv lock` proved it unsatisfiable — sk 1.43.1/1.44.0 pin
    # azure-ai-projects>=1.0.0b12,<1.1.dev0 while agent-framework-foundry
    # (pulled in via agent-framework-core[all]) requires azure-ai-projects
    # >=2.2.0. The previously documented opentelemetry clash is gone at
    # sk 1.43+ (now ~=1.24) but this azure-ai-projects conflict replaces it.
    # To use sk 1.44.0, install standalone without agent-framework.
    # Source: https://pypi.org/pypi/semantic-kernel/json (verified 2026-08-03)
    "semantic-kernel>=1.36.0",
    # google-adk 2.6.1 (latest 2.x, 2026-07-31); 1.x line latest is 1.37.0.
    # Updated picture as of 2026-08-03:
    # (1) The langgraph<0.4.8 requirement STILL EXISTS in both lines but only
    #     under the `extensions`/`test` extras — the base package has no
    #     langgraph dependency, so it does not bind this combined extra.
    # (2) Both lines now require google-genai>=2.9,<3 (inverted from the old
    #     <2.0.0 constraint, switched at adk 1.36.0) and pydantic>=2.12,<3.
    # (3) opentelemetry: adk 1.37.0 caps <=1.41.1 (conflicts with
    #     crewai>=1.15's ~=1.42.0); adk 2.6.1 allows >=1.39,<=1.42.1 — so the
    #     resolver picks the 2.x line alongside crewai 1.15+.
    # Floor stays at 1.14.1 (permissive); the universal lock resolves to 2.x.
    # Source: https://pypi.org/pypi/google-adk/json (verified 2026-08-03)
    "google-adk>=1.14.1",
]
# NOTE: the native-tool-adapter frameworks (pydantic-ai, openai-agents,
# smolagents, haystack-ai, agno, strands-agents, dspy) are intentionally NOT a project extra: several
# of them (e.g. openai-agents requires pydantic>=2.12.2) cannot co-resolve with
# the `agent-frameworks` extra (pydantic<2.12 via crewai/agent-framework), and a
# project extra must satisfy uv's *universal* lock alongside every other extra.
# They are installed directly (in an isolated env) by the `framework-adapters`
# CI job, which runs tests/frameworks/test_real_packages.py to guard each
# adapter against real-API drift. langchain/langgraph/llamaindex/crewai/
# semantic-kernel/google-adk are validated by the main matrix via `agent-frameworks`.
example-tools = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "einops>=0.8.1",
    "huggingface-hub[hf-xet]>=0.36.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pint>=0.24.4",
    "psutil>=5.9.0",
    "pubchempy>=1.0.5",
    "pypdf>=3.0.0",
    "python-barcode>=0.15.0",
    "python-docx>=1.0.0",
    "python-dotenv>=1.1.1",
    "pytz>=2023.3",
    "qrcode>=7.4.0",
    "rdkit>=2025.9.3",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "sympy>=1.14.0",
    "textblob>=0.18.0",
]
# Individual embedding providers
embeddings = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
]
openai = [
    # 2.53.0 (latest stable, 2026-08-03): adds gpt-5.5 and tool name/namespace
    # in Responses types. No breaking changes documented anywhere in
    # 2.41.1 → 2.53.0 (2.49.0 enforces Python >=3.10, matching Gantry);
    # Chat Completions / Responses / tool-calling surfaces intact.
    # Floor bumped 2.41.0 → 2.45.0 because langchain-openai 1.4.x and
    # openai-agents 0.19.x both require openai>=2.45.0,<3.
    # Deprecation notice: gpt-4o and gpt-4o-mini shut down 2026-10-23; replacements
    # are gpt-5.5 and gpt-5.4-mini respectively. gpt-4.1 is NOT deprecated.
    # Source: https://pypi.org/pypi/openai/json (verified 2026-08-03)
    "openai>=2.45.0",
]
cohere = [
    # cohere 7.0.8 (latest stable 2026-07-23) — patch releases only since 7.0.3;
    # AsyncClientV2.rerank() unchanged. Breaking change in 7.0.0: minimum
    # Python version raised from ^3.8 to ^3.10 — compatible with Gantry's
    # requires-python = ">=3.10". Gantry's CohereReranker import
    # (from cohere import AsyncClientV2) continues to work without modification.
    # Source: https://github.com/cohere-ai/cohere-python/releases (verified 2026-08-03)
    #         https://docs.cohere.com/v2/reference/rerank
    "cohere>=7.0.8",
]
# Individual vector store providers
qdrant = [
    "qdrant-client>=1.7.0",
]
chroma = [
    "chromadb>=0.4.0",
]
pgvector = [
    "asyncpg>=0.29.0",
]
lancedb = [
    "lancedb>=0.4.0",
    "pyarrow>=14.0.1",
]
# Combined vector stores
vector-stores = [
    "qdrant-client>=1.7.0",
    "chromadb>=0.4.0",
    "asyncpg>=0.29.0",
]
nomic = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "einops>=0.8.1",
]
mcp = [
    # Range <3: Gantry supports BOTH mcp 1.x and 2.x through one code path
    # (added 2026-08-03, verified by running the test suite against 1.28.1 and
    # 2.0.0). The client surface (`ClientSession` / `StdioServerParameters` /
    # `stdio_client`) survives unchanged in 2.0.0; the two real breaks are
    # handled in-tree: (1) servers/mcp_server.py branches handler
    # registration — 1.x `@server.list_tools()` decorators vs 2.x
    # `Server(name, on_list_tools=..., on_call_tool=...)` constructor
    # callbacks returning full result models; (2) mcp_client.py reads the
    # tool schema dual-spelled (`input_schema` on 2.x, `inputSchema` on 1.x —
    # the 1.x-only read silently returned an empty schema under 2.x).
    # Cross-version protocol interop over stdio is confirmed both directions
    # (v1 client <-> v2 server). Note the combined `all` extra still locks
    # mcp 1.x because openai-agents pins mcp>=1.19,<2 and
    # agent-framework-core[all] pins mcp>=1.24,<2; standalone
    # `agent-gantry[mcp]` installs may resolve 2.x.
    # Source: https://pypi.org/pypi/mcp/json (verified 2026-08-03)
    "mcp>=1.27.2,<3",
]
a2a = [
    "httpx>=0.24.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
# LLM provider SDK dependencies
anthropic = [
    # 0.120.2 (latest stable, 2026-07-28). 19 additive releases since 0.107.1;
    # no breaking changes to Messages API or tool-use surfaces used by Gantry.
    # Integration-surface notes: 0.119.0 adds stop reason
    # `model_context_window_exceeded` (exhaustive stop_reason matching must
    # tolerate it); 0.120.0 adds tool addition/removal content blocks and
    # `tool_change` stream events (streaming handlers should ignore unknown
    # event types); 0.120.1 pins the SDK's mcp extra to <2, 0.120.2 supports
    # mcp v2 alongside v1.
    # Note: claude-opus-4-1 retires 2026-08-05 — not referenced in Gantry's
    # source or examples.
    # Source: https://pypi.org/pypi/anthropic/json (verified 2026-08-03)
    #         https://github.com/anthropics/anthropic-sdk-python/releases
    "anthropic>=0.120.2",
]
google-genai = [
    # google-genai 2.16.0 (latest stable 2026-07-30). GenerateContent and
    # function calling / FunctionDeclaration are untouched across 2.9 → 2.16
    # (2.11.0's removals and 2.14.0's deprecations affect the Interactions API
    # and Imagen surfaces only).
    # IMPORTANT INVERSION since the 2026-06 audits: google-adk >=1.36.0 (both
    # the 1.x and 2.x lines) now REQUIRES google-genai>=2.9,<3 — the old
    # "adk needs <2.0.0" constraint no longer holds, so the combined all[]
    # extra resolves to a 2.x google-genai. The permissive >=1.75.0 floor is
    # kept for standalone users on the 1.x series.
    # Source: https://pypi.org/pypi/google-genai/json (verified 2026-08-03)
    "google-genai>=1.75.0",
]
google-vertexai = [
    "google-cloud-aiplatform>=1.70.0",
]
mistral = [
    # Update 2026-08-03: the PyPI quarantine of mistralai (imposed 2026-05-12
    # after a malicious 2.4.6 upload) has been LIFTED — releases resumed
    # 2026-06-03 and the latest is 2.8.0 (2026-07-28). Gantry deliberately
    # keeps the OpenAI-compatible path: Mistral's chat endpoint works with the
    # OpenAI SDK via base_url="https://api.mistral.ai/v1" on AsyncOpenAI(),
    # and the MistralAdapter in agent_gantry.adapters.tool_spec translates
    # tool schemas correctly for this pattern. Reinstating the native SDK
    # (mistralai>=2.5.0, i.e. post-incident) is possible but would require
    # adapter code changes — tracked as a possible follow-up, not done here.
    # Install with: pip install "agent-gantry[mistral]"
    "openai>=2.45.0",
]
groq = [
    # 1.6.0 (released 2026-07-24) — latest stable; 1.5.0/1.6.0 are additive
    # generated-SDK minors.
    # Source: https://pypi.org/pypi/groq/json (verified 2026-08-03)
    "groq>=1.6.0",
]
# Combined LLM provider dependencies
llm-providers = [
    # mistralai package is quarantined on PyPI (2026-05-12). The mistral extra
    # resolves to openai>=2.36.0 (Mistral is OpenAI-compatible). Including it
    # here ensures [all] users inherit the mistral path and any future
    # Mistral-specific dependencies are picked up automatically.
    "agent-gantry[openai,anthropic,google-genai,google-vertexai,mistral,groq]",
]
all = [
    "agent-gantry[dev,embeddings,openai,cohere,vector-stores,lancedb,nomic,mcp,a2a,llm-providers,agent-frameworks,example-tools]",
]

[project.scripts]
agent-gantry = "agent_gantry.cli:main"

[project.urls]
Homepage = "https://github.com/CodeHalwell/Agent-Gantry"
Repository = "https://github.com/CodeHalwell/Agent-Gantry"

[tool.hatch.build.targets.wheel]
packages = ["agent_gantry"]

[tool.hatch.build.targets.wheel.shared-data]
"agent_gantry/skills/agent-gantry" = "share/claude/skills/agent-gantry"

[tool.hatch.build]
# Make sure SKILL.md and the references/ tree ship inside the wheel
# alongside the package itself. The shared-data table above also
# publishes a copy under ``share/claude/skills/`` so Claude Code can
# find the skill via the standard discovery path
# (``$VENV/share/claude/skills/`` is searched at startup).
include = [
    "agent_gantry/**/*.py",
    "agent_gantry/**/*.md",
    "agent_gantry/**/*.txt",
    "agent_gantry/skills/**/*",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
prerelease = "if-necessary-or-explicit"
# Force an onnxruntime version that ships cp310 wheels. onnxruntime >=1.24.0
# dropped Python 3.10 support (only cp311/cp312/cp313 wheels are published),
# but the resolver still picks it because the sdist metadata advertises
# Python 3.10 compatibility. Pin to the 1.23.x series for 3.10 so uv sync
# on the CI matrix entry `test (ubuntu-latest, 3.10)` actually has a wheel
# to install.
override-dependencies = [
    "onnxruntime<1.24 ; python_version < '3.11'",
    # agent-framework-azure-ai-search==0.0.0a1 is a 2.3 KB stub wheel that ships
    # an empty agent_framework/__init__.py and clobbers the real one from
    # agent-framework-core when both install into the shared namespace. Force
    # selection of the 1.0.0bYYMMDD beta line, which packages correctly.
    # (The former azure-search-documents>=11.7.0b2 companion override was
    # removed 2026-08-03: azure-search-documents 12.0.0 is stable since
    # 2026-05-01 and the current AF search beta depends on >=12.0.0,<13, so no
    # prerelease pin is needed under the "if-necessary-or-explicit" policy.)
    "agent-framework-azure-ai-search>=1.0.0b1",
]

