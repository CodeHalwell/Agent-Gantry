[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-gantry"
version = "0.7.0"
description = "Universal Tool Orchestration Platform - Intelligent, secure tool orchestration for LLM-based agent systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Agent-Gantry Contributors" }
]
keywords = [
    "llm",
    "agents",
    "tools",
    "mcp",
    "orchestration",
    "semantic-routing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema>=4.18.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    # pytest-asyncio 1.x changed event-loop lifecycle on macOS (kqueue) + Python
    # 3.10/3.12, causing CI failures. Pin to the stable 0.x series until the
    # upstream compatibility issue is resolved.
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "python-dotenv>=1.0.0",
]
agent-frameworks = [
    # Range: >=1.5.0,<2.0.0.
    # AF 1.8.0 (released 2026-06-04): adds McpSkillsSource for MCP-based
    # skills discovery, progressive tool exposure via FunctionInvocationContext,
    # background-agent harness support, and AgentFileStore / FileAccessProvider
    # for file-access operations.  Bug fixes: resolves message-id collisions in
    # compaction (benefits GantryContextProvider), fixes unsafe serialisation of
    # function arguments in AF's observability layer (benefits GantryToolBridge).
    # Skill API refactored to async resource / script lookup (experimental — not
    # used by Gantry, which uses its own SkillRegistry).  Sync tools now execute
    # off the event loop; Gantry's bridge already wraps all callables as async so
    # no double-wrapping occurs.  Breaking change: github-copilot-sdk upgraded to
    # v1.0.0 stable (not used by Gantry).  No Gantry code changes required.
    # Source: https://pypi.org/pypi/agent-framework/json
    #         https://github.com/microsoft/agent-framework/releases
    #
    # AF 1.7.0 (released 2026-05-28): adds HarnessAgent / background-agents
    # harness provider, A2AAgentSession with referenced task IDs, and fixes a
    # streaming memory-growth regression in DevUI and hosted handoff argument
    # serialisation.  Breaking change: "Remove Python-only declarative actions
    # and rename alias kinds to C# canonical names." Gantry does NOT use
    # declarative actions (@agent_framework.action), so no Gantry code is
    # affected.  Checkpoint restoration for MessageRole values is now fixed,
    # which benefits HandoffBuilder workflows that use serialised checkpoints.
    # Source: https://github.com/microsoft/agent-framework/releases
    #
    # AF 1.6.0 (released 2026-05-22) introduced instrumentation enabled by
    # default.  Its ContextVar tokens cannot be reset across asyncio child
    # contexts, so calling two Agent.run() coroutines concurrently via
    # asyncio.gather() / TaskGroup raises:
    #   ValueError: <Token ...> was created in a different Context
    # in agent_framework/observability.py.  This is an upstream bug in AF 1.6.0;
    # it does NOT affect sequential workflows (WorkflowAgent, SequentialBuilder,
    # HandoffBuilder all dispatch one Agent at a time).
    #
    # Workaround for concurrent workflows on AF >=1.6.0:
    #   from agent_gantry import disable_af_instrumentation
    #   disable_af_instrumentation()   # call once before agent construction
    # This shim calls agent_framework.telemetry.disable_instrumentation() when
    # AF >=1.6.0 is detected.  Use GantryObservabilityMiddleware to retain
    # per-invocation tracing without the ContextVar clash.
    # GantryToolBridge also accepts disable_af_instrumentation=True to apply
    # the shim automatically at bridge construction time.
    #
    # AF 1.5.0 features retained: intermediate output handling,
    # ContextProvider.before_run tools-in-session fix (directly benefits
    # GantryContextProvider), Azure OpenAI recording, YAML block scalar parsing.
    # Prior 1.4.0 breaking changes: (1) SkillFrontmatter extraction
    # (experimental, not used by Gantry); (2) DevUI CORS tightening (not
    # relevant). Prior 1.3.0 breaking changes: (3) skills multi-source
    # restructuring (experimental, not used); (4) bespoke Foundry toolbox
    # helpers removed in favour of MCP (not used). Prior 1.2.2 note retained:
    # sequential-approval and concurrent workflow terminal outputs return as
    # AgentResponse — use str() or .content to extract text.
    # Source: https://pypi.org/pypi/agent-framework/json
    #         https://github.com/microsoft/agent-framework/releases
    "agent-framework>=1.5.0,<2.0.0",
    "autogen-agentchat>=0.7.5",
    "autogen-ext[openai]>=0.7.5",
    # crewai 1.14.6 (latest stable, 2026-05-31) pins opentelemetry-api~=1.34.0 (<1.35),
    # which conflicts with agent-framework>=1.2.1 (requires opentelemetry-api>=1.39.0).
    # crewai==1.6.1 co-installs with agent-framework. For crewai 1.14.6 (standalone),
    # install in a separate environment without agent-framework.
    # Source: https://pypi.org/pypi/crewai/json
    "crewai>=1.6.1",
    # langchain 1.3.4 (released 2026-06-02) — patch release; no API changes.
    # Source: https://pypi.org/pypi/langchain/json
    "langchain>=1.3.4",
    # langchain-openai 1.2.2 (released 2026-05-26) — patch release; no API changes.
    # Source: https://pypi.org/pypi/langchain-openai/json
    "langchain-openai>=1.2.2",
    # langgraph 1.2.4 (released 2026-06-02) — patch release; no API changes.
    # Floor bumped from 1.2.2 to 1.2.4.
    # Source: https://pypi.org/pypi/langgraph/json
    "langgraph>=1.2.4",
    "llama-index-core>=0.14.22",
    "llama-index-llms-openai>=0.7.7",
    # semantic-kernel 1.43.0 (latest stable 2026-06-04) — no API changes affecting
    # Gantry. An opentelemetry-api version incompatibility with agent-framework persists
    # on some Python versions. Until that conflict is confirmed resolved, the floor stays
    # at >=1.36.0. Upgrade to 1.43.0 in a standalone environment without agent-framework.
    # Note: the previous pydantic conflict with google-adk 1.33.0 is now moot for
    # semantic-kernel alone (1.43.0 allows pydantic>=2.12), but google-adk 1.33.0 also
    # requires langgraph<0.4.8 which conflicts with langgraph>=1.2.0 in this extra
    # (see google-adk comment).
    "semantic-kernel>=1.36.0",
    # google-adk 2.2.0 (latest stable, 2026-06-05) — minor release over 2.1.0.
    # Two separate conflicts prevent upgrading in this combined extra:
    # (1) google-adk 2.x (like 1.34.x before it) requires langgraph<0.4.8 via
    #     its extensions extra, which is incompatible with langgraph>=1.2.4 here.
    #     This cannot be resolved by a simple floor bump and remains the primary
    #     blocker for google-adk 2.x in the combined agent-frameworks extra.
    # (2) Potential transitive pydantic / opentelemetry-api conflicts introduced
    #     by 2.x internals require validation in an isolated environment first.
    # Floor stays at 1.14.1. To use google-adk 2.2.0 (latest stable), install
    # it in a standalone environment without langchain/langgraph:
    #   pip install "agent-gantry[google-genai]" "google-adk>=2.2.0"
    # Source: https://pypi.org/pypi/google-adk/json (verified 2026-06-05)
    "google-adk>=1.14.1",
]
# NOTE: the native-tool-adapter frameworks (pydantic-ai, openai-agents,
# smolagents, haystack-ai, agno) are intentionally NOT a project extra: several
# of them (e.g. openai-agents requires pydantic>=2.12.2) cannot co-resolve with
# the `agent-frameworks` extra (pydantic<2.12 via crewai/agent-framework), and a
# project extra must satisfy uv's *universal* lock alongside every other extra.
# They are installed directly (in an isolated env) by the `framework-adapters`
# CI job, which runs tests/frameworks/test_real_packages.py to guard each
# adapter against real-API drift. langchain/langgraph/llamaindex/crewai/
# semantic-kernel/google-adk are validated by the main matrix via `agent-frameworks`.
example-tools = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "einops>=0.8.1",
    "huggingface-hub[hf-xet]>=0.36.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pint>=0.24.4",
    "psutil>=5.9.0",
    "pubchempy>=1.0.5",
    "pypdf>=3.0.0",
    "python-barcode>=0.15.0",
    "python-docx>=1.0.0",
    "python-dotenv>=1.1.1",
    "pytz>=2023.3",
    "qrcode>=7.4.0",
    "rdkit>=2025.9.3",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "sympy>=1.14.0",
    "textblob>=0.18.0",
]
# Individual embedding providers
embeddings = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
]
openai = [
    # 2.41.0 (released 2026-06-03): adds responses.moderation and
    # chat_completions.moderation endpoints. No breaking changes to Chat Completions
    # or Responses API surfaces used by Gantry.
    # 2.40.0 (released 2026-06-01): adds Amazon Bedrock Responses support and
    # allows setting Bedrock API keys directly on the client instance. No breaking
    # changes to Chat Completions or Responses API surfaces used by Gantry.
    # 2.39.0 (released 2026-06-01): adds workload_identity in audit logs,
    # additional_tools in Responses API response objects (server-side hosted tool
    # metadata), and makes ActionSearch.query optional. No breaking changes.
    # Deprecation notice: gpt-4o and gpt-4o-mini shut down 2026-10-23; replacements
    # are gpt-5.5 and gpt-5.4-mini respectively. gpt-4.1 is NOT deprecated.
    # Source: https://pypi.org/pypi/openai/json
    "openai>=2.41.0",
]
cohere = [
    # cohere 7.0.3 (latest stable 2026-06-03). Breaking change in 7.0.0: minimum
    # Python version raised from ^3.8 to ^3.10 — compatible with Gantry's
    # requires-python = ">=3.10". AsyncClientV2.rerank() API is unchanged across
    # 6.x → 7.x; Gantry's CohereReranker import (from cohere import AsyncClientV2)
    # continues to work without modification.
    # Source: https://github.com/cohere-ai/cohere-python/releases
    #         https://docs.cohere.com/v2/reference/rerank
    "cohere>=7.0.3",
]
# Individual vector store providers
qdrant = [
    "qdrant-client>=1.7.0",
]
chroma = [
    "chromadb>=0.4.0",
]
pgvector = [
    "asyncpg>=0.29.0",
]
lancedb = [
    "lancedb>=0.4.0",
    "pyarrow>=14.0.1",
]
# Combined vector stores
vector-stores = [
    "qdrant-client>=1.7.0",
    "chromadb>=0.4.0",
    "asyncpg>=0.29.0",
]
nomic = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "einops>=0.8.1",
]
mcp = [
    # 1.27.2 (released 2026-05-29) — patch release; no API changes.
    # Source: https://pypi.org/pypi/mcp/json
    "mcp>=1.27.2",
]
a2a = [
    "httpx>=0.24.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
# LLM provider SDK dependencies
anthropic = [
    # 0.107.1 (released 2026-06-07): latest stable as of 2026-06-08. Foundry x-api-key
    # header fix. No breaking changes to Messages API or tool-use surfaces used by Gantry.
    # 0.107.0 (released 2026-06-06): minor type updates for Managed Agents API; no
    # breaking changes to Messages API or tool-use surfaces used by Gantry.
    # 0.106.0 (released 2026-06-05): claude-opus-4-1 formally marked as deprecated in
    # SDK (retiring 2026-08-05); Foundry client copy()/with_options() fixes; schema
    # $ref/$defs transform fix. No breaking changes to Messages API or tool-use surfaces.
    # Note: claude-opus-4-1 is not referenced in Gantry's source or examples.
    # 0.105.2 (released 2026-05-29): thinking-token-count streaming beta +
    # encrypted_content compaction fix. No breaking changes across 0.104→0.105.
    # Source: https://pypi.org/pypi/anthropic/json
    #         https://github.com/anthropics/anthropic-sdk-python/releases
    "anthropic>=0.107.1",
]
google-genai = [
    # google-genai 2.8.0 (latest stable 2026-06-04) — breaking changes in 2.0.0 were
    # limited to the Interactions API (SSE event renames, response_format restructuring);
    # GenerateContent and function calling are entirely unaffected across 1.x and 2.x.
    # google-adk (in the agent-frameworks extra) requires google-genai<2.0.0 across all
    # versions up to 2.0.0, so the combined all[] extra keeps a 1.x-compatible floor.
    # The pip resolver picks the latest compatible version (2.8.0 for standalone
    # [google-genai] installs; >=1.75.0,<2.0.0 when google-adk is co-installed).
    # Standalone 2.x upgrade: pip install "agent-gantry[google-genai]"
    # Source: https://pypi.org/pypi/google-genai/json (verified 2026-06-04)
    "google-genai>=1.75.0",
]
google-vertexai = [
    "google-cloud-aiplatform>=1.70.0",
]
mistral = [
    # mistralai (the official Mistral AI SDK) was quarantined on PyPI on
    # 2026-05-12 and is no longer installable from the package index.
    # Mistral's chat endpoint is OpenAI-compatible, so the OpenAI SDK is the
    # correct replacement: pass base_url="https://api.mistral.ai/v1" to
    # AsyncOpenAI(). The MistralAdapter in agent_gantry.adapters.tool_spec
    # continues to translate tool schemas correctly for both patterns.
    # Install with: pip install "agent-gantry[mistral]"
    "openai>=2.41.0",
]
groq = [
    # 1.4.0 (released 2026-05-28) — latest stable as of 2026-05-31.
    # Source: https://pypi.org/pypi/groq/json
    "groq>=1.4.0",
]
# Combined LLM provider dependencies
llm-providers = [
    # mistralai package is quarantined on PyPI (2026-05-12). The mistral extra
    # resolves to openai>=2.36.0 (Mistral is OpenAI-compatible). Including it
    # here ensures [all] users inherit the mistral path and any future
    # Mistral-specific dependencies are picked up automatically.
    "agent-gantry[openai,anthropic,google-genai,google-vertexai,mistral,groq]",
]
all = [
    "agent-gantry[dev,embeddings,openai,cohere,vector-stores,lancedb,nomic,mcp,a2a,llm-providers,agent-frameworks,example-tools]",
]

[project.scripts]
agent-gantry = "agent_gantry.cli:main"

[project.urls]
Homepage = "https://github.com/CodeHalwell/Agent-Gantry"
Repository = "https://github.com/CodeHalwell/Agent-Gantry"

[tool.hatch.build.targets.wheel]
packages = ["agent_gantry"]

[tool.hatch.build.targets.wheel.shared-data]
"agent_gantry/skills/agent-gantry" = "share/claude/skills/agent-gantry"

[tool.hatch.build]
# Make sure SKILL.md and the references/ tree ship inside the wheel
# alongside the package itself. The shared-data table above also
# publishes a copy under ``share/claude/skills/`` so Claude Code can
# find the skill via the standard discovery path
# (``$VENV/share/claude/skills/`` is searched at startup).
include = [
    "agent_gantry/**/*.py",
    "agent_gantry/**/*.md",
    "agent_gantry/**/*.txt",
    "agent_gantry/skills/**/*",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
prerelease = "if-necessary-or-explicit"
# Force an onnxruntime version that ships cp310 wheels. onnxruntime >=1.24.0
# dropped Python 3.10 support (only cp311/cp312/cp313 wheels are published),
# but the resolver still picks it because the sdist metadata advertises
# Python 3.10 compatibility. Pin to the 1.23.x series for 3.10 so uv sync
# on the CI matrix entry `test (ubuntu-latest, 3.10)` actually has a wheel
# to install.
override-dependencies = [
    "onnxruntime<1.24 ; python_version < '3.11'",
    # agent-framework-azure-ai-search==0.0.0a1 is a 2.3 KB stub wheel that ships
    # an empty agent_framework/__init__.py and clobbers the real one from
    # agent-framework-core when both install into the shared namespace. Force
    # selection of the 1.0.0bYYMMDD beta line, which packages correctly. The
    # azure-search-documents override is required because the beta transitively
    # depends on a pre-release of that package, which uv won't pick up under the
    # project's "if-necessary-or-explicit" prerelease policy without an explicit
    # version constraint here.
    "agent-framework-azure-ai-search>=1.0.0b1",
    "azure-search-documents>=11.7.0b2",
]

