[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-gantry"
version = "0.4.0"
description = "Universal Tool Orchestration Platform - Intelligent, secure tool orchestration for LLM-based agent systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Agent-Gantry Contributors" }
]
keywords = [
    "llm",
    "agents",
    "tools",
    "mcp",
    "orchestration",
    "semantic-routing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema>=4.18.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    # pytest-asyncio 1.x changed event-loop lifecycle on macOS (kqueue) + Python
    # 3.10/3.12, causing CI failures. Pin to the stable 0.x series until the
    # upstream compatibility issue is resolved.
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "python-dotenv>=1.0.0",
]
agent-frameworks = [
    # Range: >=1.5.0,<2.0.0.
    # AF 1.6.0 (released 2026-05-22) introduced instrumentation enabled by
    # default.  Its ContextVar tokens cannot be reset across asyncio child
    # contexts, so calling two Agent.run() coroutines concurrently via
    # asyncio.gather() / TaskGroup raises:
    #   ValueError: <Token ...> was created in a different Context
    # in agent_framework/observability.py.  This is an upstream bug in AF 1.6.0;
    # it does NOT affect sequential workflows (WorkflowAgent, SequentialBuilder,
    # HandoffBuilder all dispatch one Agent at a time).
    #
    # Workaround for concurrent workflows on AF >=1.6.0:
    #   from agent_gantry import disable_af_instrumentation
    #   disable_af_instrumentation()   # call once before agent construction
    # This shim calls agent_framework.telemetry.disable_instrumentation() when
    # AF >=1.6.0 is detected.  Use GantryObservabilityMiddleware to retain
    # per-invocation tracing without the ContextVar clash.
    # GantryToolBridge also accepts disable_af_instrumentation=True to apply
    # the shim automatically at bridge construction time.
    #
    # AF 1.5.0 features retained: intermediate output handling,
    # ContextProvider.before_run tools-in-session fix (directly benefits
    # GantryContextProvider), Azure OpenAI recording, YAML block scalar parsing.
    # Prior 1.4.0 breaking changes: (1) SkillFrontmatter extraction
    # (experimental, not used by Gantry); (2) DevUI CORS tightening (not
    # relevant). Prior 1.3.0 breaking changes: (3) skills multi-source
    # restructuring (experimental, not used); (4) bespoke Foundry toolbox
    # helpers removed in favour of MCP (not used). Prior 1.2.2 note retained:
    # sequential-approval and concurrent workflow terminal outputs return as
    # AgentResponse — use str() or .content to extract text.
    # Source: https://pypi.org/pypi/agent-framework/json
    #         https://github.com/microsoft/agent-framework/releases
    "agent-framework>=1.5.0,<2.0.0",
    "autogen-agentchat>=0.7.5",
    "autogen-ext[openai]>=0.7.5",
    # crewai 1.14.5 (latest stable) pins opentelemetry-api~=1.34.0 (<1.35), which
    # conflicts with agent-framework>=1.2.1 (requires opentelemetry-api>=1.39.0).
    # crewai==1.6.1 co-installs with agent-framework. For crewai 1.14.5 (standalone),
    # install in a separate environment without agent-framework.
    "crewai>=1.6.1",
    # langchain 1.3.1 (released 2026-05-16) — patch release; no API changes.
    "langchain>=1.3.1",
    "langchain-openai>=1.2.1",
    # langgraph 1.2.1 (released 2026-05-22) — patch release; no API changes.
    # Floor bumped from 1.2.0 to 1.2.1.
    # Source: https://pypi.org/pypi/langgraph/json
    "langgraph>=1.2.1",
    "llama-index-core>=0.14.22",
    "llama-index-llms-openai>=0.7.7",
    # semantic-kernel 1.42.0 (latest stable 2026-05-15) relaxes the pydantic
    # upper bound to <2.14 (was <2.12 in <=1.41.x), but retains an opentelemetry-api
    # version incompatibility with agent-framework on some Python versions. Until that
    # conflict is confirmed resolved, the floor stays at >=1.36.0. Upgrade to 1.42.0
    # in a standalone environment without agent-framework. Note: the previous pydantic
    # conflict with google-adk 1.33.0 is now moot for semantic-kernel alone (1.42.0
    # allows pydantic>=2.12), but google-adk 1.33.0 also requires langgraph<0.4.8
    # which conflicts with langgraph>=1.2.0 in this extra (see google-adk comment).
    "semantic-kernel>=1.36.0",
    # google-adk 2.1.0 (latest stable, 2026-05-22) introduced a Workflow Runtime
    # and Task API (major version bump from 1.x). Two separate conflicts prevent
    # upgrading in this combined extra:
    # (1) google-adk 2.x (like 1.34.x before it) requires langgraph<0.4.8 via
    #     its extensions extra, which is incompatible with langgraph>=1.2.1 here.
    #     This cannot be resolved by a simple floor bump and remains the primary
    #     blocker for google-adk 2.x in the combined agent-frameworks extra.
    # (2) Potential transitive pydantic / opentelemetry-api conflicts introduced
    #     by 2.x internals require validation in an isolated environment first.
    # Floor stays at 1.14.1. To use google-adk 2.1.0, install it in a standalone
    # environment without langchain/langgraph:
    #   pip install "agent-gantry[google-genai]" "google-adk>=2.1.0"
    # Source: https://pypi.org/pypi/google-adk/json
    "google-adk>=1.14.1",
]
example-tools = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "einops>=0.8.1",
    "huggingface-hub[hf-xet]>=0.36.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pint>=0.24.4",
    "psutil>=5.9.0",
    "pubchempy>=1.0.5",
    "pypdf>=3.0.0",
    "python-barcode>=0.15.0",
    "python-docx>=1.0.0",
    "python-dotenv>=1.1.1",
    "pytz>=2023.3",
    "qrcode>=7.4.0",
    "rdkit>=2025.9.3",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "sympy>=1.14.0",
    "textblob>=0.18.0",
]
# Individual embedding providers
embeddings = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
]
openai = [
    # 2.38.0 (released 2026-05-21): adds service_tier to responses compact,
    # pydantic iterator eager-validation, and workload-identity auth cleanup.
    # No breaking changes.
    # Source: https://pypi.org/pypi/openai/json
    "openai>=2.38.0",
]
cohere = [
    # cohere 6.0.0 (2026) renamed the async client from AsyncClient to AsyncClientV2.
    # Gantry's CohereReranker now uses AsyncClientV2 (cohere.py updated accordingly).
    # Upper bound left open — no further breaking changes are anticipated in the
    # GenerateContent / rerank surface.
    "cohere>=6.0.0",
]
# Individual vector store providers
qdrant = [
    "qdrant-client>=1.7.0",
]
chroma = [
    "chromadb>=0.4.0",
]
pgvector = [
    "asyncpg>=0.29.0",
]
lancedb = [
    "lancedb>=0.4.0",
    "pyarrow>=14.0.1",
]
# Combined vector stores
vector-stores = [
    "qdrant-client>=1.7.0",
    "chromadb>=0.4.0",
    "asyncpg>=0.29.0",
]
nomic = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "einops>=0.8.1",
]
mcp = [
    "mcp>=1.27.1",
]
a2a = [
    "httpx>=0.24.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
# LLM provider SDK dependencies
anthropic = [
    # 0.104.1 (released 2026-05-22): 0.104.0 added thinking-token-count beta for
    # streaming; 0.104.1 is a patch fixing encrypted_content not being carried
    # through the beta compaction accumulator. No breaking changes.
    # Source: https://pypi.org/pypi/anthropic/json
    "anthropic>=0.104.1",
]
google-genai = [
    # google-genai 2.6.0 (latest stable 2026-05-22) — breaking changes in 2.0.0 were
    # limited to the Interactions API (SSE event renames, response_format restructuring);
    # GenerateContent and function calling are entirely unaffected across 1.x and 2.x.
    # google-adk (in the agent-frameworks extra) requires google-genai<2.0.0 across all
    # versions up to 2.0.0, so the combined all[] extra keeps a 1.x-compatible floor.
    # The pip resolver picks the latest compatible version (2.6.0 for standalone
    # [google-genai] installs; >=1.75.0,<2.0.0 when google-adk is co-installed).
    # Standalone 2.x upgrade: pip install "agent-gantry[google-genai]"
    # Source: https://pypi.org/pypi/google-genai/json
    "google-genai>=1.75.0",
]
google-vertexai = [
    "google-cloud-aiplatform>=1.70.0",
]
mistral = [
    # mistralai (the official Mistral AI SDK) was quarantined on PyPI on
    # 2026-05-12 and is no longer installable from the package index.
    # Mistral's chat endpoint is OpenAI-compatible, so the OpenAI SDK is the
    # correct replacement: pass base_url="https://api.mistral.ai/v1" to
    # AsyncOpenAI(). The MistralAdapter in agent_gantry.adapters.tool_spec
    # continues to translate tool schemas correctly for both patterns.
    # Install with: pip install "agent-gantry[mistral]"
    "openai>=2.38.0",
]
groq = [
    "groq>=1.2.0",
]
# Combined LLM provider dependencies
llm-providers = [
    # mistralai package is quarantined on PyPI (2026-05-12). The mistral extra
    # resolves to openai>=2.36.0 (Mistral is OpenAI-compatible). Including it
    # here ensures [all] users inherit the mistral path and any future
    # Mistral-specific dependencies are picked up automatically.
    "agent-gantry[openai,anthropic,google-genai,google-vertexai,mistral,groq]",
]
all = [
    "agent-gantry[dev,embeddings,openai,cohere,vector-stores,lancedb,nomic,mcp,a2a,llm-providers,agent-frameworks,example-tools]",
]

[project.scripts]
agent-gantry = "agent_gantry.cli:main"

[project.urls]
Homepage = "https://github.com/CodeHalwell/Agent-Gantry"
Repository = "https://github.com/CodeHalwell/Agent-Gantry"

[tool.hatch.build.targets.wheel]
packages = ["agent_gantry"]

[tool.hatch.build.targets.wheel.shared-data]
"agent_gantry/skills/agent-gantry" = "share/claude/skills/agent-gantry"

[tool.hatch.build]
# Make sure SKILL.md and the references/ tree ship inside the wheel
# alongside the package itself. The shared-data table above also
# publishes a copy under ``share/claude/skills/`` so Claude Code can
# find the skill via the standard discovery path
# (``$VENV/share/claude/skills/`` is searched at startup).
include = [
    "agent_gantry/**/*.py",
    "agent_gantry/**/*.md",
    "agent_gantry/**/*.txt",
    "agent_gantry/skills/**/*",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
prerelease = "if-necessary-or-explicit"
# Force an onnxruntime version that ships cp310 wheels. onnxruntime >=1.24.0
# dropped Python 3.10 support (only cp311/cp312/cp313 wheels are published),
# but the resolver still picks it because the sdist metadata advertises
# Python 3.10 compatibility. Pin to the 1.23.x series for 3.10 so uv sync
# on the CI matrix entry `test (ubuntu-latest, 3.10)` actually has a wheel
# to install.
override-dependencies = [
    "onnxruntime<1.24 ; python_version < '3.11'",
    # agent-framework-azure-ai-search==0.0.0a1 is a 2.3 KB stub wheel that ships
    # an empty agent_framework/__init__.py and clobbers the real one from
    # agent-framework-core when both install into the shared namespace. Force
    # selection of the 1.0.0bYYMMDD beta line, which packages correctly. The
    # azure-search-documents override is required because the beta transitively
    # depends on a pre-release of that package, which uv won't pick up under the
    # project's "if-necessary-or-explicit" prerelease policy without an explicit
    # version constraint here.
    "agent-framework-azure-ai-search>=1.0.0b1",
    "azure-search-documents>=11.7.0b2",
]

