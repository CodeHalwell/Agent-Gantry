name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A newer push to the same pull request makes the older run's result moot, so cancel
# it. Runs on main and develop are never cancelled: each is a result worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check version sync (pyproject.toml == agent_gantry/__init__.py)
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          init=$(grep -m1 -E '^__version__' agent_gantry/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$version" != "$init" ]; then
            echo "::error::pyproject version ($version) != agent_gantry/__init__.py ($init)"
            exit 1
          fi
          echo "version sync OK: $version"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # --locked fails the job when uv.lock is out of date with pyproject.toml (a
        # floor raised or a version bumped without `uv lock`) instead of quietly
        # re-resolving it on the runner, which would leave the committed lock untested.
        run: uv sync --locked --extra dev --extra nomic --extra lancedb --extra agent-frameworks --extra example-tools

      - name: Run ruff
        run: uv run ruff check agent_gantry/

      - name: Run ty (informational)
        # Static typing is not gated in CI (see CLAUDE.md) — ty exits 1 on any
        # diagnostic, and main itself carries warnings, so this step reports
        # without failing the job. Ruff (above) remains the enforced gate.
        run: uvx ty check agent_gantry/ --warn all --exit-zero

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --locked: see the lint job.
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra nomic --extra lancedb --extra agent-frameworks --extra example-tools

      - name: Run tests
        # The ubuntu / 3.12 cell runs the suite once, under coverage, in the next step.
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        # PYTORCH_MPS_HIGH_WATERMARK_RATIO: on Apple Silicon runners, torch's
        # MPS allocator caps at ~7.9 GiB and sentence-transformers model loads
        # accumulate against it over the session, flaking late tests with
        # "MPS backend out of memory" (observed twice on macos 3.10). 0.0
        # lifts the artificial cap — the fix torch's own error suggests.
        # No effect on Linux/Windows (no MPS backend).
        env:
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
        run: |
          uv run pytest --ignore=tests/test_phase5_mcp.py --ignore=tests/test_phase6_a2a.py -v

      - name: Run tests with coverage (Ubuntu, Python 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv run pytest --cov=agent_gantry --cov-report=xml --ignore=tests/test_phase5_mcp.py --ignore=tests/test_phase6_a2a.py -v

      - name: Upload coverage to Codecov (Ubuntu, Python 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          # Codecov needs this token for a commit on a protected branch such as main;
          # only pull requests from forks upload without one. Add it as the repository
          # secret CODECOV_TOKEN. Until then the upload is skipped, never a failure.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  framework-adapters:
    name: Framework adapter smoke tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Single macOS cell to catch platform-specific drift without
          # multiplying the full OS x Python grid (cost control).
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      # Isolated env: the native-adapter frameworks (pydantic-ai, openai-agents,
      # haystack, agno, strands-agents) don't co-resolve with the
      # combined agent-frameworks/nomic set, so they are NOT a project extra.
      # Install the project (dev) then add them directly with a one-off
      # resolution, and run the real-package adapter smoke tests. importorskip
      # handles any that aren't present (e.g. a Strands adapter landing later
      # can rely on the package already being installed here).
      # langchain/llamaindex/crewai/SK/ADK are covered by the main `test`
      # matrix (which installs the `agent-frameworks` extra).
      # Resolve the project (dev) + the adapter frameworks together in ONE
      # isolated venv, so a shared dep (pydantic/httpx/openai) is resolved to a
      # single compatible version rather than installed-then-downgraded.
      # Uncapped since 2026-08-03: adapters verified against pydantic-ai 2.23.0
      # (keyword-only construction spans 1.x/2.x — no changes were needed),
      # haystack-ai 3.0.0 (ToolInvoker removal handled by a version branch in
      # GantryLiveHaystackToolInvoker.build, guarded by
      # tests/frameworks/test_haystack_build_live.py), and dspy 3.3.0 (fully
      # backward compatible on the adapter surface; ReActV2 remains a separate
      # experimental class).
      - name: Run adapter smoke tests
        run: |
          uv venv .venv-frameworks --python ${{ matrix.python-version }}
          uv pip install --python .venv-frameworks ".[dev]" \
            pydantic-ai-slim openai-agents haystack-ai agno strands-agents dspy
          .venv-frameworks/bin/python -m pytest tests/frameworks/ -v

  docs:
    name: Verify Astro docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install docs dependencies
        run: npm ci

      - name: Build Astro docs
        run: npm run build

  build:
    name: Verify package builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Check distribution
        run: uv tool run twine check dist/*
