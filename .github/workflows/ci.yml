name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check release metadata consistency
        run: python scripts/check_release.py

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra nomic --extra lancedb --extra agent-frameworks --extra example-tools

      - name: Run ruff
        run: uv run ruff check dotfetch/ examples/ scripts/ tests/

      - name: Run ty (informational)
        # Static typing is not gated in CI (see CLAUDE.md) — ty exits 1 on any
        # diagnostic, and main itself carries warnings, so this step reports
        # without failing the job. Ruff (above) remains the enforced gate.
        run: uvx ty check dotfetch/ --warn all --exit-zero

  test:
    runs-on: ${{ matrix.os }}
    env:
      DOTFETCH_REQUIRED_FRAMEWORKS: langchain,langgraph,llamaindex,crewai,google_adk,agent_framework
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra nomic --extra lancedb --extra agent-frameworks --extra example-tools

      - name: Run tests
        # PYTORCH_MPS_HIGH_WATERMARK_RATIO: on Apple Silicon runners, torch's
        # MPS allocator caps at ~7.9 GiB and sentence-transformers model loads
        # accumulate against it over the session, flaking late tests with
        # "MPS backend out of memory" (observed twice on macos 3.10). 0.0
        # lifts the artificial cap — the fix torch's own error suggests.
        # No effect on Linux/Windows (no MPS backend).
        env:
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
          # CrewAI's supported SDK requires Python <3.14. All other SDKs in
          # agent-frameworks must import on every supported Python version.
          DOTFETCH_REQUIRED_FRAMEWORKS: ${{ matrix.python-version == '3.14' && 'agent_framework,langchain,langgraph,llamaindex,google_adk' || 'agent_framework,langchain,langgraph,llamaindex,google_adk,crewai' }}
        run: |
          uv run pytest --ignore=tests/test_phase5_mcp.py --ignore=tests/test_phase6_a2a.py -v

      - name: Run tests with coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv run pytest --cov=dotfetch --cov-report=xml --ignore=tests/test_phase5_mcp.py --ignore=tests/test_phase6_a2a.py

      - name: Upload coverage to Codecov (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  framework-adapters:
    name: Framework adapter smoke tests
    runs-on: ${{ matrix.os }}
    env:
      DOTFETCH_REQUIRED_FRAMEWORKS: pydantic_ai,openai_agents,haystack,agno,strands,dspy
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Single macOS cell to catch platform-specific drift without
          # multiplying the full OS x Python grid (cost control).
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      # Isolated env: the native-adapter frameworks (pydantic-ai, openai-agents,
      # haystack, agno, strands-agents) are tested independently of the
      # combined agent-frameworks/nomic set to keep dependency trees isolated.
      # Install the project (dev) then add them directly with a one-off
      # resolution, and run the real-package adapter smoke tests. The declared
      # DOTFETCH_REQUIRED_FRAMEWORKS must import; SDKs covered by the other test
      # group remain optional here.
      # langchain/llamaindex/crewai/ADK are covered by the main `test`
      # matrix (which installs the `agent-frameworks` extra).
      # Resolve the project (dev) + the adapter frameworks together in ONE
      # isolated venv, so a shared dep (pydantic/httpx/openai) is resolved to a
      # single compatible version rather than installed-then-downgraded.
      # Uncapped since 2026-08-03 (pydantic-ai now via its own extra, floor
      # 2.0.0, verified through 2.71.0 on 2026-11-19): adapters verified against pydantic-ai 2.23.0
      # (keyword-only construction spans 1.x/2.x — no changes were needed),
      # haystack-ai 3.0.0 (ToolInvoker removal handled by a version branch in
      # DotFetchLiveHaystackToolInvoker.build, guarded by
      # tests/frameworks/test_haystack_build_live.py), and dspy 3.3.0 (fully
      # backward compatible on the adapter surface; ReActV2 remains a separate
      # experimental class).
      # strands-agents 0.0.1 is an empty placeholder. Without a real-version
      # floor, uv can select it to keep a newer MCP dependency on Python 3.10/3.11.
      # DSPy comes from its own extra (floor 3.5.0, the redesigned ReAct with
      # native `tool_calls` and a `submit` tool); the earlier dspy<3.5 cap is gone.
      - name: Run adapter smoke tests
        run: |
          uv venv .venv-frameworks --python ${{ matrix.python-version }}
          uv pip install --python .venv-frameworks \
            ".[dev,pydantic-ai,openai-agents,strands,agno,haystack,dspy]"
          .venv-frameworks/bin/python -m pytest tests/frameworks/ -v

      # Pydantic AI is first-class with a declared floor (the `pydantic-ai`
      # extra, >=2.0.0). Re-run its tests on exactly the floor so a change
      # that needs a newer release is caught here, not by users. One cell.
      # Same for the OpenAI Agents SDK (`openai-agents` extra, >=0.23.1)
      # LangChain / LangGraph (`langchain` / `langgraph` extras, >=1.0.0)
      # Google ADK (`google-adk` extra, >=2.6.1), CrewAI (`crewai`, >=1.15.22), LlamaIndex (`llamaindex`, >=0.13.0),
      # Strands (`strands`, >=1.38.0), Agno (`agno`, >=2.6.10), Haystack (`haystack`, >=3.0.0)
      # and DSPy (`dspy`, >=3.5.0).
      - name: OpenAI Agents SDK floor (0.23.1)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv venv .venv-openai-agents-floor --python ${{ matrix.python-version }}
          uv pip install --python .venv-openai-agents-floor ".[dev]" "openai-agents==0.23.1"
          .venv-openai-agents-floor/bin/python -m pytest \
            tests/frameworks/test_openai_agents.py tests/frameworks/test_openai_agents_live.py \
            tests/frameworks/test_openai_agents_native.py -v

      - name: LangChain / LangGraph floor (1.0.0)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv venv .venv-langchain-floor --python ${{ matrix.python-version }}
          uv pip install --python .venv-langchain-floor ".[dev]" \
            "langchain==1.0.0" "langchain-core==1.0.0" "langgraph==1.0.0"
          .venv-langchain-floor/bin/python -m pytest \
            tests/frameworks/test_langchain.py tests/frameworks/test_langgraph.py \
            tests/frameworks/test_langgraph_live.py tests/frameworks/test_langgraph_native.py -v

      - name: Google ADK floor (2.6.1)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv venv .venv-google-adk-floor --python ${{ matrix.python-version }}
          uv pip install --python .venv-google-adk-floor ".[dev]" "google-adk==2.6.1"
          .venv-google-adk-floor/bin/python -m pytest \
            tests/frameworks/test_google_adk.py tests/frameworks/test_google_adk_live.py \
            tests/frameworks/test_google_adk_native.py -v

      - name: CrewAI floor (1.15.22)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv venv .venv-crewai-floor --python ${{ matrix.python-version }}
          uv pip install --python .venv-crewai-floor ".[dev]" "crewai==1.15.22"
          .venv-crewai-floor/bin/python -m pytest \
            tests/frameworks/test_crewai.py tests/frameworks/test_crewai_native.py -v

      - name: LlamaIndex floor (0.13.0)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv venv .venv-llamaindex-floor --python ${{ matrix.python-version }}
          uv pip install --python .venv-llamaindex-floor ".[dev]" "llama-index-core==0.13.0"
          .venv-llamaindex-floor/bin/python -m pytest \
            tests/frameworks/test_llamaindex.py tests/frameworks/test_llamaindex_live.py \
            tests/frameworks/test_llamaindex_native.py -v

      - name: Strands Agents floor (1.38.0)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv venv .venv-strands-floor --python ${{ matrix.python-version }}
          uv pip install --python .venv-strands-floor ".[dev]" "strands-agents==1.38.0"
          .venv-strands-floor/bin/python -m pytest \
            tests/frameworks/test_strands.py tests/frameworks/test_strands_live.py \
            tests/frameworks/test_strands_native.py -v

      - name: Agno floor (2.6.10)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv venv .venv-agno-floor --python ${{ matrix.python-version }}
          # aiosqlite + sqlalchemy[asyncio]: AsyncSqliteDb, for the async-db resume test.
          uv pip install --python .venv-agno-floor ".[dev]" "agno==2.6.10" \
            aiosqlite "sqlalchemy[asyncio]"
          .venv-agno-floor/bin/python -m pytest \
            tests/frameworks/test_agno.py tests/frameworks/test_agno_native.py -v

      - name: Haystack floor (3.0.0)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv venv .venv-haystack-floor --python ${{ matrix.python-version }}
          uv pip install --python .venv-haystack-floor ".[dev]" "haystack-ai==3.0.0"
          .venv-haystack-floor/bin/python -m pytest \
            tests/frameworks/test_haystack.py tests/frameworks/test_haystack_build_live.py \
            tests/frameworks/test_haystack_native.py -v

      - name: DSPy floor (3.5.0)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv venv .venv-dspy-floor --python ${{ matrix.python-version }}
          uv pip install --python .venv-dspy-floor ".[dev]" "dspy==3.5.0"
          .venv-dspy-floor/bin/python -m pytest \
            tests/frameworks/test_dspy.py tests/frameworks/test_dspy_live.py \
            tests/frameworks/test_dspy_native.py -v

      - name: Pydantic AI floor (2.0.0)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv venv .venv-pydantic-ai-floor --python ${{ matrix.python-version }}
          uv pip install --python .venv-pydantic-ai-floor ".[dev]" "pydantic-ai-slim==2.0.0"
          .venv-pydantic-ai-floor/bin/python -m pytest \
            tests/frameworks/test_pydantic_ai.py tests/frameworks/test_pydantic_ai_live.py -v

  docs:
    name: Verify Astro docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install docs dependencies
        run: npm ci

      - name: Build Astro docs
        run: npm run build

  build:
    name: Verify package builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Check distribution
        run: uv tool run twine check dist/*
