name: Latest framework drift check

# pyproject.toml intentionally floors several framework extras below their
# latest upstream release because they don't co-resolve with each other in
# the combined `agent-frameworks` extra (see the dated comments there for the
# exact conflicts: google-adk vs langgraph, crewai/semantic-kernel vs
# agent-framework on opentelemetry-api). The main `test` matrix therefore
# only ever exercises the pinned floors, so drift on the *latest* release of
# each conflicting framework is invisible until a user hits it.
#
# This workflow installs each conflicting framework at latest in its own
# isolated venv (mirroring the standalone-install recipes documented in
# pyproject.toml) and runs only that framework's tests. It is schedule/
# workflow_dispatch only — it never runs on push/pull_request — so a failure
# here signals upstream drift without blocking merges.

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  latest-frameworks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # google-adk 2.x requires langgraph<0.4.8, which conflicts with the
          # langgraph>=1.2.4 floor in the `agent-frameworks` extra, so install
          # it standalone per the pyproject comment (no langchain/langgraph).
          # test_real_packages.py rides along: importorskip limits it to the
          # one framework this cell installs, and it is the only suite that
          # builds AND invokes the native tool object.
          - name: google-adk (latest)
            install: '".[dev,google-genai]" "google-adk>=2.2.0"'
            tests: tests/frameworks/test_google_adk.py tests/frameworks/test_google_adk_live.py tests/frameworks/test_real_packages.py

          # crewai's latest release pins opentelemetry-api ~=1.34, which
          # conflicts with agent-framework's opentelemetry-api>=1.39 floor, so
          # install it standalone without agent-framework.
          # (no -k filter: importorskip already limits test_live_wrappers /
          # test_real_packages to the frameworks this cell installs)
          - name: crewai (latest)
            install: '".[dev]" crewai'
            tests: tests/frameworks/test_crewai.py tests/frameworks/test_live_wrappers.py tests/frameworks/test_real_packages.py

          # semantic-kernel's latest release has the same opentelemetry-api
          # conflict with agent-framework, so install it standalone.
          # --prerelease=allow: sk >=1.43.1 depends on a pre-release
          # azure-ai-agents (>=1.2.0b3); without the flag uv quietly resolves
          # sk back to 1.36.0 and this cell tests the floor while claiming to
          # test latest (verified 2026-08-26 — 1.44.1 only installs with the
          # flag; the adapter passes on it).
          - name: semantic-kernel (latest)
            install: '--prerelease=allow ".[dev]" semantic-kernel'
            tests: tests/frameworks/test_semantic_kernel.py tests/frameworks/test_semantic_kernel_live.py tests/frameworks/test_real_packages.py

          # langchain/langgraph/llamaindex track fast-moving release lines and
          # previously had no latest-drift cell at all (only the lock-driven
          # floors in the main matrix). autogen-core/agentchat ride along —
          # all of these co-resolve without agent-framework in the venv.
          - name: langchain + llamaindex + autogen (latest)
            install: '".[dev]" langchain langgraph langchain-core llama-index-core autogen-core autogen-agentchat'
            tests: tests/frameworks/test_langchain.py tests/frameworks/test_langgraph.py tests/frameworks/test_langgraph_live.py tests/frameworks/test_llamaindex.py tests/frameworks/test_llamaindex_live.py tests/frameworks/test_autogen.py tests/frameworks/test_autogen_live.py tests/frameworks/test_real_packages.py

          # Classic AG2 (module `autogen`, the register_function API targeted
          # by AutoGenAdapter.register) is frozen on the <1 line — AG2 1.x
          # renamed its import to `ag2` with a new agent API, and pyautogen
          # >=0.10 became a Microsoft autogen-agentchat shim. This cell guards
          # the register() path, which no other job installs a package for.
          - name: ag2 classic (0.x)
            install: '".[dev]" "ag2[openai]<1"'
            tests: tests/frameworks/test_autogen.py

          # agent-framework itself is floored below latest (<2.0 stays on the
          # documented 1.x series); validate the newest 1.x release standalone.
          - name: agent-framework (latest 1.x)
            install: '".[dev]" "agent-framework<2.0"'
            tests: tests/test_agent_framework_adapter.py tests/test_agent_framework_integration.py tests/test_agent_framework_provider.py tests/test_agent_framework_orchestration.py tests/frameworks/test_real_packages.py

          # The native-tool-adapter frameworks are never a project extra (see
          # pyproject.toml) because they can't co-resolve with the combined
          # agent-frameworks set. Validate their latest releases together,
          # same as the `framework-adapters` CI job but unpinned.
          - name: native adapters (latest)
            install: '".[dev]" pydantic-ai-slim openai-agents smolagents haystack-ai agno strands-agents dspy'
            tests: tests/frameworks/
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      # Isolated env per cell: install exactly the one conflicting framework
      # at latest alongside the project's dev deps, deliberately NOT the full
      # extras, so this venv's resolution is independent of the pinned floors.
      - name: Install isolated env
        run: |
          uv venv .venv-latest --python 3.12
          uv pip install --python .venv-latest ${{ matrix.install }}

      - name: Run tests
        run: |
          .venv-latest/bin/python -m pytest ${{ matrix.tests }} -v
