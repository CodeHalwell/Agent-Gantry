name: Latest framework drift check

# pyproject.toml intentionally floors several framework extras below their
# latest upstream release because they don't co-resolve with each other in
# the combined `agent-frameworks` extra (see the dated comments there for the
# exact conflicts: google-adk vs langgraph, crewai vs
# agent-framework on opentelemetry-api). The main `test` matrix therefore
# only ever exercises the pinned floors, so drift on the *latest* release of
# each conflicting framework is invisible until a user hits it.
#
# This workflow installs each conflicting framework at latest in its own
# isolated venv (mirroring the standalone-install recipes documented in
# pyproject.toml) and runs only that framework's tests. It is schedule/
# workflow_dispatch only — it never runs on push/pull_request — so a failure
# here signals upstream drift without blocking merges.

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  latest-frameworks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Check ADK's latest Google SDK and telemetry dependencies separately
          # so constraints from other frameworks cannot hold it on an old release.
          # test_real_packages.py rides along: importorskip limits it to the
          # one framework this cell installs, and it is the only suite that
          # builds AND invokes the native tool object.
          - name: google-adk (latest)
            required: google_adk
            install: '".[dev,google-genai]" "google-adk>=2.2.0"'
            tests: tests/frameworks/test_google_adk.py tests/frameworks/test_google_adk_live.py tests/frameworks/test_real_packages.py

          # Check CrewAI independently of AF and ADK so their telemetry and
          # model SDK constraints cannot hold CrewAI on an old release.
          # (no -k filter: importorskip already limits test_live_wrappers /
          # test_real_packages to the frameworks this cell installs)
          - name: crewai (latest)
            required: crewai
            install: '".[dev]" crewai'
            tests: tests/frameworks/test_crewai.py tests/frameworks/test_live_wrappers.py tests/frameworks/test_real_packages.py

          # langchain/langgraph/llamaindex track fast-moving release lines and
          # previously had no latest-drift cell at all (only the lock-driven
          # floors in the main matrix). All of these co-resolve without
          # agent-framework in the venv.
          - name: langchain + llamaindex (latest)
            required: langchain,langgraph,llamaindex
            install: '".[dev]" langchain langgraph langchain-core llama-index-core'
            tests: tests/frameworks/test_langchain.py tests/frameworks/test_langgraph.py tests/frameworks/test_langgraph_live.py tests/frameworks/test_llamaindex.py tests/frameworks/test_llamaindex_live.py tests/frameworks/test_real_packages.py

          # agent-framework itself is floored below latest (<2.0 stays on the
          # documented 1.x series); validate the newest 1.x release standalone.
          - name: agent-framework (latest 1.x)
            required: agent_framework
            install: '".[dev]" "agent-framework<2.0"'
            tests: tests/test_agent_framework_adapter.py tests/test_agent_framework_integration.py tests/test_agent_framework_provider.py tests/test_agent_framework_orchestration.py tests/frameworks/test_real_packages.py

          # The native-tool-adapter frameworks are tested separately from the
          # combined agent-frameworks set (see pyproject.toml). Validate their latest releases together,
          # same as the `framework-adapters` CI job but unpinned.
          - name: native adapters (latest)
            required: pydantic_ai,openai_agents,haystack,agno,strands,dspy
            install: '".[dev]" pydantic-ai-slim openai-agents haystack-ai agno strands-agents dspy'
            tests: tests/frameworks/
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      # Isolated env per cell: install exactly the one conflicting framework
      # at latest alongside the project's dev deps, deliberately NOT the full
      # extras, so this venv's resolution is independent of the pinned floors.
      - name: Install isolated env
        run: |
          uv venv .venv-latest --python 3.12
          uv pip install --python .venv-latest ${{ matrix.install }}

      - name: Run tests
        env:
          GANTRY_REQUIRED_FRAMEWORKS: ${{ matrix.required }}
        run: |
          .venv-latest/bin/python -m pytest ${{ matrix.tests }} -v
